<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>KidCam</title><!-- v3.0 puppet -->
<style>
  html,body{margin:0;height:100%;background:#eef3f8;color:#1a2330;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #video{display:none}
  .pill{position:fixed;top:10px;left:10px;right:10px;text-align:center;pointer-events:none;z-index:2}
  .pill span{display:inline-block;background:rgba(255,255,255,.9);padding:7px 14px;border-radius:20px;font-size:14px;border:1px solid #d7dee6}
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;
       background:rgba(255,255,255,.94);border-top:1px solid #d7dee6;font-size:14px;z-index:3;transition:transform .25s}
  #bar.hidden{transform:translateY(105%)}
  button,select{font:inherit;padding:9px 13px;border-radius:10px;border:1px solid #c5ced9;background:#fff;color:#1a2330;cursor:pointer}
  button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
  button.on{background:#dfe9ff;border-color:#1f6feb}
  .chr{font-size:22px;padding:5px 10px;line-height:1}
  label{display:flex;align-items:center;gap:5px}
  #peek{position:fixed;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.8);border:1px solid #c5ced9;font-size:19px;display:none;z-index:3}
  #err{position:fixed;inset:0;background:rgba(238,243,248,.97);display:none;align-items:center;justify-content:center;padding:20px;z-index:6}
  #err .card{max-width:520px;background:#fff;border:1px solid #f0b5a8;border-radius:14px;padding:22px;font-size:16px;line-height:1.5}
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="stage"></canvas>
<div class="pill"><span id="status">Loading the body-tracking model…</span></div>
<button id="peek" title="Controls">⚙</button>
<div id="err"><div class="card"><div id="errText"></div><p><button id="errOk" class="primary">Try again</button></p></div></div>

<div id="bar">
  <button id="start" class="primary" disabled>Loading…</button>
  <span id="chars"></span>
  <button id="faceBtn" class="on">🙂 Face on</button>
  <label>Scene <select id="scene">
    <option value="snow" selected>Snow</option><option value="road">Road</option>
    <option value="sky">Sky</option><option value="space">Space</option><option value="plain">Plain</option>
  </select></label>
  <button id="reset">Re-centre</button>
  <button id="fs">Fullscreen</button>
  <button id="hide">Hide</button>
</div>

<script type="module">
import { FilesetResolver, PoseLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $ = id => document.getElementById(id);
const video=$('video'), stage=$('stage'), ctx=stage.getContext('2d'), statusEl=$('status');
const src=document.createElement('canvas'), sctx=src.getContext('2d');       // mirrored camera frame
const fc=document.createElement('canvas'), fctx=fc.getContext('2d');         // face crop
const fm=document.createElement('canvas'), fmx=fm.getContext('2d');          // face feather mask

// ---------- characters ----------
const CHARS = {
  yeti:{ icon:'🦍', main:'#f4f8fc', shade:'#cddff0', line:'#9dbdd8', trim:'#a9c9e2', edge:'fluff',
         skin:'#eaf3fb', nose:'#4a6b85', build:1.0 },
  dino:{ icon:'🦖', main:'#7fd08c', shade:'#54a864', line:'#2f7a41', trim:'#f4c542', edge:'spike',
         skin:'#a7e2b0', nose:'#2f6b3a', build:1.05 },
  robot:{ icon:'🤖', main:'#cfd8e2', shade:'#9fb0c1', line:'#6f8296', trim:'#4aa3ff', edge:'bolt',
         skin:'#e6edf4', nose:'#3c5568', build:0.95 },
};
let charName='yeti';
const C = () => CHARS[charName];

// ---------- state ----------
let landmarker=null, camOn=false, running=false;
let lm=null, lastSeen=0, faceOn=true, scene='snow';
let view={z:1, px:0, py:0};
let fit={s:1,ox:0,oy:0};
let lastTs=0;

// ---------- ui ----------
const charWrap=$('chars');
Object.entries(CHARS).forEach(([k,v],i)=>{ const b=document.createElement('button');
  b.className='chr'+(i===0?' on':''); b.textContent=v.icon; b.title=k;
  b.onclick=()=>{ charName=k; [...charWrap.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); touchBar(); };
  charWrap.appendChild(b); });
$('faceBtn').onclick=()=>{ faceOn=!faceOn; $('faceBtn').classList.toggle('on',faceOn); $('faceBtn').textContent=faceOn?'🙂 Face on':'🙂 Face off'; touchBar(); };
$('scene').onchange=e=>scene=e.target.value;
$('reset').onclick=()=>{ view={z:1,px:0,py:0}; touchBar(); };
$('fs').onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>{});
$('hide').onclick=hideBar; $('peek').onclick=showBar;
$('start').onclick=()=>start();
$('errOk').onclick=()=>{ $('err').style.display='none'; start(); };
let barTimer;
function hideBar(){ $('bar').classList.add('hidden'); $('peek').style.display='block'; }
function showBar(){ $('bar').classList.remove('hidden'); $('peek').style.display='none'; touchBar(); }
function touchBar(){ clearTimeout(barTimer); if(running) barTimer=setTimeout(hideBar,7000); }
$('bar').addEventListener('pointerdown',touchBar);

// ---------- camera ----------
function camError(e){
  let why;
  if(!window.isSecureContext) why=`Page isn't on HTTPS (${location.protocol}//) so the browser refuses the camera. Open <b>https://frinoahds.github.io/kidcam/</b>.`;
  else if(/denied|permission/i.test(e.message||e.name)) why=`<b>Camera is blocked for this site.</b><br>Tap the icon left of the address → Permissions → Camera → Allow → reload.<br>Still stuck: Chrome ⋮ → Settings → Site settings → Camera → this site → Allow; and Android Settings → Apps → Chrome → Permissions → Camera on.`;
  else why=`Camera error: ${e.name} — ${e.message}`;
  $('errText').innerHTML=why; $('err').style.display='flex';
}
async function start(){
  if(!landmarker) return;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:'user'},audio:false});
    video.srcObject=stream; await video.play();
    src.width=video.videoWidth; src.height=video.videoHeight;
    camOn=true; running=true; $('start').textContent='Camera on'; $('start').disabled=true; touchBar();
  }catch(e){ camError(e); }
}

// ---------- one-euro smoothing (kills the jitter) ----------
const F={};
const alphaOf=(cut,rate)=>{ const tau=1/(2*Math.PI*cut); return 1/(1+tau*rate); };
function smooth(key,v,dt){
  const s = F[key] || (F[key]={hat:v,dhat:0,init:true});
  if(s.init){ s.init=false; s.hat=v; return v; }
  const rate=1/Math.max(dt,1/120);
  const dv=(v-s.hat)*rate;
  const ad=alphaOf(1.0,rate); s.dhat=ad*dv+(1-ad)*s.dhat;
  const a=alphaOf(1.0+1.5*Math.abs(s.dhat),rate);
  s.hat=a*v+(1-a)*s.hat;
  return s.hat;
}

// ---------- geometry ----------
function resize(){ stage.width=innerWidth*devicePixelRatio; stage.height=innerHeight*devicePixelRatio; }
addEventListener('resize',resize); resize();
function computeFit(){ const W=stage.width,H=stage.height,vw=src.width||640,vh=src.height||480;
  const s=Math.max(W/vw,H/vh); fit={s,ox:(W-vw*s)/2,oy:(H-vh*s)/2}; }
const P = i => { const p=lm[i]; return {x:fit.ox+p.x*src.width*fit.s, y:fit.oy+p.y*src.height*fit.s, v:p.visibility??1}; };
const mid = (a,b)=>({x:(a.x+b.x)/2, y:(a.y+b.y)/2, v:Math.min(a.v,b.v)});
const dist = (a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

// ---------- pinch / pan to place the character ----------
const pts=new Map(); let gest=null;
stage.addEventListener('pointerdown',e=>{ pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); stage.setPointerCapture(e.pointerId);
  if(pts.size===1){ const p=[...pts.values()][0]; gest={mode:'pan',x:p.x,y:p.y,px:view.px,py:view.py}; }
  else if(pts.size===2){ const [a,b]=[...pts.values()]; gest={mode:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y),z:view.z}; }
  else showBar();
});
stage.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!gest) return;
  if(gest.mode==='pan' && pts.size===1){ const p=[...pts.values()][0];
    view.px=gest.px+(p.x-gest.x)*devicePixelRatio; view.py=gest.py+(p.y-gest.y)*devicePixelRatio; }
  else if(gest.mode==='pinch' && pts.size===2){ const [a,b]=[...pts.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y); view.z=Math.max(0.3,Math.min(3.5,gest.z*(d/(gest.d||1)))); }
});
function endPt(e){ pts.delete(e.pointerId); if(pts.size===0) gest=null;
  else if(pts.size===1){ const p=[...pts.values()][0]; gest={mode:'pan',x:p.x,y:p.y,px:view.px,py:view.py}; } }
stage.addEventListener('pointerup',endPt); stage.addEventListener('pointercancel',endPt);

// ---------- character drawing ----------
function capsule(a,b,w,color){ ctx.strokeStyle=color; ctx.lineWidth=w; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
function edging(a,b,w,n){ // fur / spikes / bolts along a limb — deterministic so it never shimmers
  const c=C(), dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1, px=-dy/len, py=dx/len;
  ctx.fillStyle=c.shade;
  for(let i=0;i<n;i++){
    const t=(i+0.5)/n, s=i%2?1:-1, ox=a.x+dx*t+px*s*w*0.44, oy=a.y+dy*t+py*s*w*0.44;
    if(c.edge==='fluff'){ ctx.beginPath(); ctx.arc(ox,oy,w*0.27,0,7); ctx.fill(); }
    else if(c.edge==='spike'){ const sp=w*0.42;
      ctx.beginPath(); ctx.moveTo(ox-dx/len*sp*0.7,oy-dy/len*sp*0.7);
      ctx.lineTo(ox+px*s*sp,oy+py*s*sp); ctx.lineTo(ox+dx/len*sp*0.7,oy+dy/len*sp*0.7); ctx.closePath(); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(ox,oy,w*0.12,0,7); ctx.fill(); }
  }
}
function limb(a,b,w){ const c=C();
  edging(a,b,w,Math.max(3,Math.round(dist(a,b)/(w*0.55))));
  capsule(a,b,w+w*0.16,c.line); capsule(a,b,w,c.main); }

function drawFace(head,R,angle){
  // build a PORTRAIT box from head width — pose landmarks stop at the eyes/mouth,
  // so their bounding box is a short wide strip and crops the forehead and chin off.
  const e1=lm[7], e2=lm[8], n=lm[0];
  const vis=Math.max(e1.visibility??1, e2.visibility??1, n.visibility??1);
  if(vis<0.5) return false;
  const cxp=((e1.x+e2.x)/2)*src.width, cyp=((e1.y+e2.y)/2)*src.height;
  const ed=Math.hypot((e2.x-e1.x)*src.width,(e2.y-e1.y)*src.height);
  if(ed<10) return false;
  const sw=ed*1.95, sh=ed*2.5, sx=cxp-sw/2, sy=cyp-sh*0.40;
  const w=Math.max(8,Math.round(sw)), h=Math.max(8,Math.round(sh));
  if(fc.width!==w||fc.height!==h){ fc.width=fm.width=w; fc.height=fm.height=h; }
  fctx.clearRect(0,0,w,h); fctx.drawImage(src,sx,sy,sw,sh,0,0,w,h);
  // elliptical feather in unit space so it ALWAYS reaches full transparency at the
  // boundary — a plain radial gradient leaves opaque corners and that reads as a pasted box
  fmx.clearRect(0,0,w,h); fmx.save();
  fmx.translate(w/2,h/2); fmx.scale(w/2,h/2);
  const g=fmx.createRadialGradient(0,0,0.05,0,0,1);
  g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(0.45,'rgba(0,0,0,1)');
  g.addColorStop(0.72,'rgba(0,0,0,.6)'); g.addColorStop(0.9,'rgba(0,0,0,.18)'); g.addColorStop(1,'rgba(0,0,0,0)');
  fmx.fillStyle=g; fmx.fillRect(-1,-1,2,2); fmx.restore();
  fctx.globalCompositeOperation='destination-in'; fctx.drawImage(fm,0,0); fctx.globalCompositeOperation='source-over';
  const dw=R*1.72, dh=dw*h/w;
  ctx.save(); ctx.translate(head.x,head.y); ctx.rotate(angle);
  ctx.drawImage(fc,-dw/2,-dh*0.52,dw,dh); ctx.restore();
  return true;
}
function cartoonFace(head,R,angle){
  const c=C();
  ctx.save(); ctx.translate(head.x,head.y); ctx.rotate(angle);
  ctx.fillStyle=c.skin; ctx.beginPath(); ctx.ellipse(0,R*0.1,R*0.62,R*0.7,0,0,7); ctx.fill();
  ctx.fillStyle='#22303c';
  ctx.beginPath(); ctx.arc(-R*0.26,-R*0.02,R*0.1,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(R*0.26,-R*0.02,R*0.1,0,7); ctx.fill();
  ctx.fillStyle=c.nose; ctx.beginPath(); ctx.ellipse(0,R*0.28,R*0.16,R*0.11,0,0,7); ctx.fill();
  ctx.restore();
}

function drawPuppet(){
  const c=C();
  const Ls=P(11), Rs=P(12), Lh=P(23), Rh=P(24);
  const shoulders=mid(Ls,Rs), hips=mid(Lh,Rh);
  const sw=dist(Ls,Rs);
  if(!(sw>4) || shoulders.v<0.35) return false;
  const unit=sw;                              // everything scales off shoulder width
  const armW=unit*0.34*c.build, legW=unit*0.40*c.build, torsoW=unit*1.12*c.build;
  const ear1=P(7), ear2=P(8);
  const headC={ x:(ear1.x+ear2.x)/2, y:(ear1.y+ear2.y)/2 };
  const earD=dist(ear1,ear2);
  const R=Math.max(unit*0.40, earD*0.80)*c.build;
  const angle=Math.atan2(ear2.y-ear1.y, ear2.x-ear1.x);

  // auto-frame: whatever the camera distance, the character fills a sane slice of the screen
  const KEY=[0,11,12,13,14,15,16,23,24,25,26,27,28];
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const i of KEY){ const p=P(i); if(p.v<0.3) continue;
    x0=Math.min(x0,p.x); x1=Math.max(x1,p.x); y0=Math.min(y0,p.y); y1=Math.max(y1,p.y); }
  y0=Math.min(y0, headC.y-R*1.35);                      // head sits above every landmark
  y1+=legW*0.8;                                          // feet sit below the ankles
  const bh=Math.max(y1-y0,1), bcx=(x0+x1)/2, bcy=(y0+y1)/2;
  const W=stage.width, H=stage.height;
  const A=smooth('autoS', Math.max(0.05,Math.min(4,(H*0.62)/bh)), 1/60);
  const fx=smooth('autoX',bcx,1/60), fy=smooth('autoY',bcy,1/60);

  ctx.save();
  ctx.translate(W/2+view.px, H*0.45+view.py);
  ctx.scale(view.z*A, view.z*A);
  ctx.translate(-fx,-fy);

  // legs (behind)
  const Lk=P(25), Rk=P(26), La=P(27), Ra=P(28);
  if(Lk.v>0.3){ limb(Lh,Lk,legW); if(La.v>0.3){ limb(Lk,La,legW*0.85); foot(La,Lk,legW); } }
  if(Rk.v>0.3){ limb(Rh,Rk,legW); if(Ra.v>0.3){ limb(Rk,Ra,legW*0.85); foot(Ra,Rk,legW); } }
  // torso
  limb(shoulders,hips,torsoW);
  { const m=mid(shoulders,hips), tl=dist(shoulders,hips);
    ctx.fillStyle=c.shade; ctx.globalAlpha=.28;
    ctx.beginPath(); ctx.ellipse(m.x,m.y+tl*0.16, torsoW*0.22, tl*0.24, angle,0,7); ctx.fill();
    ctx.globalAlpha=1; }
  // arms
  const Le=P(13), Re=P(14), Lw=P(15), Rw=P(16);
  if(Le.v>0.3){ limb(Ls,Le,armW); if(Lw.v>0.3){ limb(Le,Lw,armW*0.88); hand(Lw,armW); } }
  if(Re.v>0.3){ limb(Rs,Re,armW); if(Rw.v>0.3){ limb(Re,Rw,armW*0.88); hand(Rw,armW); } }
  // head
  headEdge(headC,R);
  ctx.fillStyle=c.line; ctx.beginPath(); ctx.arc(headC.x,headC.y,R*1.06,0,7); ctx.fill();
  ctx.fillStyle=c.main; ctx.beginPath(); ctx.arc(headC.x,headC.y,R,0,7); ctx.fill();
  headExtras(headC,R,angle);
  if(!(faceOn && drawFace(headC,R,angle))) cartoonFace(headC,R,angle);

  ctx.restore();
  return true;
}
function headEdge(h,R){ // fur / spikes / plating ringing the head
  const c=C(), n=c.edge==='bolt'?10:16;
  ctx.fillStyle=c.shade;
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2, ox=h.x+Math.cos(a)*R*0.96, oy=h.y+Math.sin(a)*R*0.96;
    if(c.edge==='spike'){ const t=a+Math.PI/2, sp=R*0.3;
      ctx.beginPath(); ctx.moveTo(ox+Math.cos(t)*sp*0.5,oy+Math.sin(t)*sp*0.5);
      ctx.lineTo(h.x+Math.cos(a)*R*1.34, h.y+Math.sin(a)*R*1.34);
      ctx.lineTo(ox-Math.cos(t)*sp*0.5,oy-Math.sin(t)*sp*0.5); ctx.closePath(); ctx.fill(); }
    else if(c.edge==='bolt'){ ctx.beginPath(); ctx.arc(ox,oy,R*0.07,0,7); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(ox,oy,R*0.26,0,7); ctx.fill(); }
  }
}
function hand(p,w){ ctx.fillStyle=C().main; ctx.beginPath(); ctx.arc(p.x,p.y,w*0.62,0,7); ctx.fill();
  ctx.fillStyle=C().shade; ctx.beginPath(); ctx.arc(p.x,p.y,w*0.62,0,7); ctx.globalAlpha=.25; ctx.fill(); ctx.globalAlpha=1; }
function foot(a,from,w){ const dx=a.x-from.x, dy=a.y-from.y, l=Math.hypot(dx,dy)||1;
  ctx.fillStyle=C().shade; ctx.save(); ctx.translate(a.x,a.y); ctx.rotate(Math.atan2(dy,dx)-Math.PI/2);
  ctx.beginPath(); ctx.ellipse(0,w*0.18,w*0.55,w*0.78,0,0,7); ctx.fill(); ctx.restore(); }
function headExtras(h,R,ang){
  const c=C(); ctx.save(); ctx.translate(h.x,h.y); ctx.rotate(ang); ctx.fillStyle=c.shade;
  if(charName==='yeti'){ ctx.beginPath(); ctx.arc(-R*0.86,-R*0.48,R*0.28,0,7); ctx.fill();
                         ctx.beginPath(); ctx.arc(R*0.86,-R*0.48,R*0.28,0,7); ctx.fill(); }
  else if(charName==='dino'){ ctx.fillStyle=c.trim; for(let i=-1;i<=1;i++){
      ctx.beginPath(); ctx.moveTo(i*R*0.42-R*0.16,-R*0.92); ctx.lineTo(i*R*0.42,-R*1.42); ctx.lineTo(i*R*0.42+R*0.16,-R*0.92); ctx.closePath(); ctx.fill(); } }
  else { ctx.strokeStyle=c.shade; ctx.lineWidth=R*0.09; ctx.beginPath(); ctx.moveTo(0,-R); ctx.lineTo(0,-R*1.45); ctx.stroke();
         ctx.fillStyle=c.trim; ctx.beginPath(); ctx.arc(0,-R*1.5,R*0.16,0,7); ctx.fill(); }
  ctx.restore();
}

// ---------- scenes ----------
function drawScene(W,H){
  let g;
  if(scene==='plain'){ ctx.fillStyle='#eef3f8'; ctx.fillRect(0,0,W,H); return; }
  if(scene==='snow'){ g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#bfe0f5'); g.addColorStop(.7,'#eaf6ff'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.78);
    ctx.fillStyle='#fbfdff'; ctx.beginPath(); ctx.moveTo(0,H*0.78); ctx.lineTo(W*0.3,H*0.62); ctx.lineTo(W*0.55,H*0.78); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W*0.45,H*0.78); ctx.lineTo(W*0.75,H*0.58); ctx.lineTo(W,H*0.78); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#f4fbff'; ctx.fillRect(0,H*0.78,W,H*0.22);
    ctx.fillStyle='#dbeefb'; for(let i=0;i<60;i++) ctx.fillRect((i*137)%W,(i*211)%(H*0.75),3,3); return; }
  if(scene==='sky'){ g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#6fb7ff'); g.addColorStop(1,'#dff1ff'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.font=`${H*0.11}px serif`; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillText('☁️',W*0.12,H*0.24); ctx.fillText('☁️',W*0.66,H*0.17); ctx.fillText('🌞',W*0.85,H*0.14); return; }
  if(scene==='space'){ ctx.fillStyle='#0b1a3a'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#fff';
    for(let i=0;i<90;i++) ctx.fillRect((i*97)%W,(i*193)%H,3,3);
    ctx.font=`${H*0.11}px serif`; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillText('🌍',W*0.78,H*0.26); ctx.fillText('🌙',W*0.1,H*0.2); return; }
  g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#8fcbff'); g.addColorStop(.72,'#e9f5ff'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.72);
  ctx.fillStyle='#8ccf6e'; ctx.fillRect(0,H*0.72,W,H*0.28); ctx.fillStyle='#4a4a4a'; ctx.fillRect(0,H*0.82,W,H*0.12);
  ctx.fillStyle='#fff'; for(let x=0;x<W;x+=W*0.12) ctx.fillRect(x,H*0.875,W*0.06,H*0.01);
  ctx.font=`${H*0.11}px serif`; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText('🌳',W*0.05,H*0.78); ctx.fillText('🏠',W*0.76,H*0.78);
}

// ---------- loop ----------
function loop(ts){
  requestAnimationFrame(loop);
  const W=stage.width,H=stage.height;
  computeFit(); drawScene(W,H);

  if(!running){ statusEl.textContent = landmarker ? 'Press Start camera' : 'Loading the body-tracking model…'; return; }
  if(video.readyState>=2 && ts!==lastTs){
    const dt=(ts-lastTs)/1000; lastTs=ts;
    sctx.save(); sctx.scale(-1,1); sctx.drawImage(video,-src.width,0,src.width,src.height); sctx.restore();
    const res=landmarker.detectForVideo(src,ts);
    const raw=res.landmarks&&res.landmarks[0];
    if(raw){
      lm=raw.map((p,i)=>({ x:smooth(i+'x',p.x,dt), y:smooth(i+'y',p.y,dt), visibility:p.visibility }));
      lastSeen=ts;
    } else if(ts-lastSeen>900) lm=null;
  }
  if(lm && drawPuppet()) statusEl.textContent='Drag to move · pinch to size · they move, '+charName+' moves';
  else statusEl.textContent='Step back so your whole body is in frame 🕺';
}
requestAnimationFrame(loop);

// ---------- model ----------
(async()=>{
  try{
    const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const MODEL="https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
    const make = d => PoseLandmarker.createFromOptions(vision,{
      baseOptions:{ modelAssetPath:MODEL, delegate:d },
      runningMode:"VIDEO", numPoses:1, minPoseDetectionConfidence:0.5, minTrackingConfidence:0.5 });
    try { landmarker=await make("GPU"); }
    catch(gpuErr){ console.warn('GPU delegate failed, falling back to CPU',gpuErr); landmarker=await make("CPU"); }
    $('start').disabled=false; $('start').textContent='Start camera';
    statusEl.textContent='Ready — press Start camera';
  }catch(e){ statusEl.textContent='Model failed to load: '+e.message; console.error(e); }
})();
</script>

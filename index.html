<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>KidCam</title><!-- v2.0 -->
<style>
  html,body{margin:0;height:100%;background:#eef3f8;color:#1a2330;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#eef3f8}
  #video{display:none}
  .pill{position:fixed;top:10px;left:10px;right:10px;text-align:center;pointer-events:none}
  .pill span{display:inline-block;background:rgba(255,255,255,.92);padding:8px 14px;border-radius:20px;font-size:15px;border:1px solid #d7dee6;max-width:90%}
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;
       background:rgba(255,255,255,.94);border-top:1px solid #d7dee6;font-size:14px;z-index:3}
  button,select{font:inherit;padding:9px 13px;border-radius:10px;border:1px solid #c5ced9;background:#fff;color:#1a2330;cursor:pointer}
  button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
  .veh{font-size:26px;padding:4px 8px;line-height:1}
  .veh.on{background:#dfe9ff;border-color:#1f6feb}
  label{display:flex;align-items:center;gap:4px}
  #cam{position:fixed;inset:0;display:none;z-index:4;pointer-events:none}
  #cam button{pointer-events:auto}
  #shutter{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:78px;height:78px;border-radius:50%;background:#fff;border:6px solid rgba(255,255,255,.5);box-shadow:0 2px 12px rgba(0,0,0,.4);padding:0}
  #cancel{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.9);font-size:20px;padding:0}
  #retry{position:absolute;left:14px;bottom:40px;display:none}
  #err{position:fixed;inset:0;background:rgba(238,243,248,.97);display:none;align-items:center;justify-content:center;padding:20px;z-index:6}
  #err .card{max-width:520px;background:#fff;border:1px solid #f0b5a8;border-radius:14px;padding:22px;font-size:16px;line-height:1.5}
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="stage"></canvas>
<div class="pill"><span id="status">Loading…</span></div>

<div id="cam">
  <button id="cancel">✕</button>
  <button id="retry" class="primary">Retake</button>
  <button id="shutter" title="Take photo"></button>
</div>

<div id="err"><div class="card"><div id="errText"></div><p><button id="errOk" class="primary">Try again</button></p></div></div>

<div id="bar">
  <button id="photo" class="primary">📷 Take photo</button>
  <button id="live">🎥 Live</button>
  <span id="vehicles"></span>
  <label>Crop <select id="crop"><option value="head" selected>Head</option><option value="shoulders">Shoulders</option><option value="waist">Waist</option></select></label>
  <label>Scene <select id="scene"><option value="road" selected>Road</option><option value="sky">Sky</option><option value="space">Space</option></select></label>
  <label>Size <input id="vsize" type="range" min="0.3" max="0.9" step="0.01" value="0.6"></label>
  <button id="fs">Fullscreen</button>
</div>

<script type="module">
import { FilesetResolver, ImageSegmenter, FaceDetector } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $ = id => document.getElementById(id);
const video=$('video'), stage=$('stage'), ctx=stage.getContext('2d'), statusEl=$('status');
const src = document.createElement('canvas'), sctx = src.getContext('2d');   // mirrored camera frame (what models see)
const cut = document.createElement('canvas'), cctx = cut.getContext('2d');   // live-mode person cutout
const maskC = document.createElement('canvas'), mctx = maskC.getContext('2d');

const VEHICLES = [
  {e:'🚗',seat:0.42,kid:0.5}, {e:'🚌',seat:0.35,kid:0.45}, {e:'🚂',seat:0.38,kid:0.42}, {e:'✈️',seat:0.42,kid:0.4},
  {e:'🚀',seat:0.38,kid:0.42}, {e:'🚁',seat:0.55,kid:0.4}, {e:'🚤',seat:0.40,kid:0.45}, {e:'🦖',seat:0.25,kid:0.45}, {e:'🎈',seat:1.05,kid:0.45},
];
const CROPS = { head:{up:0.9,down:1.6,side:1.2}, shoulders:{up:0.9,down:2.3,side:1.7}, waist:{up:0.9,down:3.4,side:1.9} };
let vehicle=VEHICLES[0], cropName='head', scene='road', vsizeF=0.6;
let mode='idle';            // idle | camera | pick | live
let sticker=null;           // {c:canvas, faceBottom, faceCx}
let faces=[], fit={s:1,ox:0,oy:0};
let segmenter, detector, camOn=false, invert=false, invertChecked=false;
// live mode state
let lock=null, vx=null, vy=null, drag=null, held=null, maskCoverage=0;

// ---------- UI ----------
const vehWrap=$('vehicles');
VEHICLES.forEach((v,i)=>{ const b=document.createElement('button'); b.className='veh'+(i===0?' on':''); b.textContent=v.e;
  b.onclick=()=>{ vehicle=v; [...vehWrap.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); }; vehWrap.appendChild(b); });
$('crop').onchange=e=>{ cropName=e.target.value; if(lastShot) buildSticker(lastShot.face); };
$('scene').onchange=e=>scene=e.target.value;
$('vsize').oninput=e=>vsizeF=+e.target.value;
$('fs').onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>{});
$('photo').onclick=()=>openCamera();
$('live').onclick=()=>startLive();
$('cancel').onclick=()=>{ setMode('idle'); };
$('shutter').onclick=()=>takePhoto();
$('retry').onclick=()=>{ lastShot=null; setMode('camera'); };
$('errOk').onclick=()=>{ $('err').style.display='none'; openCamera(); };

function setMode(m){
  mode=m;
  $('cam').style.display = (m==='camera'||m==='pick') ? 'block' : 'none';
  $('shutter').style.display = m==='camera' ? 'block' : 'none';
  $('retry').style.display = m==='pick' ? 'block' : 'none';
  $('bar').style.display = (m==='camera'||m==='pick') ? 'none' : 'flex';
  $('live').textContent = m==='live' ? '⏹ Stop live' : '🎥 Live';
  if(m!=='live'){ lock=null; vx=vy=null; held=null; drag=null; }
}

// ---------- camera ----------
function camError(e){
  let why;
  if(!window.isSecureContext) why=`Not HTTPS (${location.protocol}//) — browser refuses the camera. Open <b>https://frinoahds.github.io/kidcam/</b>.`;
  else if(/denied|permission/i.test(e.message||e.name)) why=`<b>Camera is blocked for this site.</b><br>Tap the icon left of the address → Permissions → Camera → Allow → reload.<br>Still blocked: Chrome ⋮ → Settings → Site settings → Camera → this site → Allow. Android Settings → Apps → Chrome → Permissions → Camera on.`;
  else why=`Camera error: ${e.name} — ${e.message}`;
  $('errText').innerHTML=why; $('err').style.display='flex';
}
async function ensureCam(){
  if(camOn) return true;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:'user'},audio:false});
    video.srcObject=stream; await video.play();
    src.width=cut.width=maskC.width=video.videoWidth; src.height=cut.height=maskC.height=video.videoHeight;
    camOn=true; return true;
  }catch(e){ camError(e); return false; }
}
async function openCamera(){ if(!segmenter||!detector){ statusEl.textContent='Still loading the AI models… try again in a few seconds'; return; } if(await ensureCam()){ lastShot=null; setMode('camera'); } }
async function startLive(){ if(mode==='live'){ setMode('idle'); return; } if(!segmenter||!detector) return; if(await ensureCam()) setMode('live'); }

function grabFrame(){ // mirrored copy of the current camera frame
  sctx.save(); sctx.scale(-1,1); sctx.drawImage(video,-src.width,0,src.width,src.height); sctx.restore();
}
function detectFaces(ts){
  const det=detector.detectForVideo(src, ts);
  faces=det.detections.map(d=>({x:d.boundingBox.originX,y:d.boundingBox.originY,w:d.boundingBox.width,h:d.boundingBox.height}));
}
// person mask of `src` → alpha into maskC. Returns coverage.
function segment(ts){
  let cov=0;
  segmenter.segmentForVideo(src, ts, res=>{
    const masks=res.confidenceMasks, m=masks[masks.length-1], data=m.getAsFloat32Array(), w=m.width, h=m.height;
    if(!invertChecked && faces.length){ // person region should score high; compare face box vs top corners
      const f=faces[0]; let fs=0,fn=0,cs=0,cn=0;
      const x0=f.x/src.width*w|0, x1=(f.x+f.w)/src.width*w|0, y0=f.y/src.height*h|0, y1=(f.y+f.h)/src.height*h|0;
      for(let y=y0;y<y1;y+=2) for(let x=x0;x<x1;x+=2){ fs+=data[y*w+x]; fn++; }
      const cw=w*0.08|0, ch=h*0.08|0;
      for(let y=0;y<ch;y++) for(let x=0;x<cw;x++){ cs+=data[y*w+x]+data[y*w+(w-1-x)]; cn+=2; }
      const a=fs/(fn||1), b=cs/(cn||1);
      if(Math.abs(a-b)>0.2){ invert=a<b; invertChecked=true; }
    }
    if(maskC.width!==w||maskC.height!==h){ maskC.width=w; maskC.height=h; }
    const img=mctx.createImageData(w,h), a=img.data; let on=0;
    for(let i=0,j=3;i<data.length;i++,j+=4){ const v=invert?1-data[i]:data[i]; if(v>0.4){ a[j]=Math.min(255,(v-0.4)*700|0); on++; } }
    mctx.putImageData(img,0,0); cov=on/data.length;
  });
  return cov;
}

// ---------- photo → sticker ----------
let lastShot=null; // {frame:canvas, faces, face}
function takePhoto(){
  const ts=performance.now();
  grabFrame(); detectFaces(ts);
  const frame=document.createElement('canvas'); frame.width=src.width; frame.height=src.height; frame.getContext('2d').drawImage(src,0,0);
  lastShot={frame, faces:faces.slice()};
  segment(ts+1);
  if(lastShot.faces.length===1){ buildSticker(lastShot.faces[0]); setMode('idle'); }
  else if(lastShot.faces.length===0){ statusEl.textContent='No face found — face the camera and try again'; }
  else setMode('pick');
}
function buildSticker(f){
  lastShot.face=f;
  const cp=CROPS[cropName];
  const sx=Math.max(0,f.x+f.w/2-f.w*cp.side), sw=Math.min(src.width-sx,f.w*cp.side*2);
  const sy=Math.max(0,f.y-f.h*cp.up), sh=Math.min(src.height-sy,f.h*cp.down);
  const c=document.createElement('canvas'); c.width=Math.round(sw); c.height=Math.round(sh); const g=c.getContext('2d');
  g.drawImage(lastShot.frame, sx,sy,sw,sh, 0,0,c.width,c.height);
  // soft-edged person mask
  const m=document.createElement('canvas'); m.width=c.width; m.height=c.height; const mg=m.getContext('2d');
  mg.filter='blur(2px)';
  mg.drawImage(maskC, sx/src.width*maskC.width, sy/src.height*maskC.height, sw/src.width*maskC.width, sh/src.height*maskC.height, 0,0,m.width,m.height);
  g.globalCompositeOperation='destination-in'; g.drawImage(m,0,0); g.globalCompositeOperation='source-over';
  sticker={c, faceBottom:(f.y+f.h)-sy, faceCx:(f.x+f.w/2)-sx};
  statusEl.textContent='In the '+vehicle.e+' — switch vehicles anytime, or take a new photo';
}

// ---------- emoji ink bounds (so the kid sits where the vehicle actually is) ----------
const inkCache={};
function ink(e){
  if(inkCache[e]) return inkCache[e];
  const S=200, c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d');
  g.font=`${S*0.6}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(e,S/2,S/2);
  const d=g.getImageData(0,0,S,S).data; let t=S,b=0,l=S,r=0;
  for(let y=0;y<S;y++) for(let x=0;x<S;x++) if(d[(y*S+x)*4+3]>40){ if(y<t)t=y; if(y>b)b=y; if(x<l)l=x; if(x>r)r=x; }
  const fs=S*0.6; return inkCache[e]={top:(t-S/2)/fs, bottom:(b-S/2)/fs, left:(l-S/2)/fs, right:(r-S/2)/fs};
}

// ---------- geometry / input ----------
function resize(){ stage.width=innerWidth*devicePixelRatio; stage.height=innerHeight*devicePixelRatio; }
addEventListener('resize',resize); resize();
function computeFit(){ const W=stage.width,H=stage.height,vw=src.width||4,vh=src.height||3; const s=Math.max(W/vw,H/vh); fit={s,ox:(W-vw*s)/2,oy:(H-vh*s)/2}; }
const toCanvas=(x,y)=>[fit.ox+x*fit.s, fit.oy+y*fit.s];
let lastTap=0;
const onVehicle=(px,py)=>vx!=null && Math.abs(px-vx)<stage.height*vsizeF*0.5 && Math.abs(py-vy)<stage.height*vsizeF*0.5;
stage.addEventListener('pointerdown',ev=>{
  const px=ev.clientX*devicePixelRatio, py=ev.clientY*devicePixelRatio, now=performance.now();
  if(mode==='idle'){ if(onVehicle(px,py)) openCamera(); return; }
  if(mode==='pick'){
    const x=(px-fit.ox)/fit.s, y=(py-fit.oy)/fit.s;
    const hit=lastShot.faces.find(f=>x>=f.x-f.w*0.4&&x<=f.x+f.w*1.4&&y>=f.y-f.h*0.6&&y<=f.y+f.h*1.4);
    if(hit){ buildSticker(hit); setMode('idle'); } return;
  }
  if(mode==='live'){
    if(lock && onVehicle(px,py)){ if(now-lastTap<400){ lock=null;vx=vy=null;held=null; lastTap=0; return; } lastTap=now; drag={dx:vx-px,dy:vy-py}; stage.setPointerCapture(ev.pointerId); return; }
    const x=(px-fit.ox)/fit.s, y=(py-fit.oy)/fit.s;
    const hit=faces.find(f=>x>=f.x-f.w*0.3&&x<=f.x+f.w*1.3&&y>=f.y-f.h*0.3&&y<=f.y+f.h*1.3);
    if(hit){ lock={cx:hit.x+hit.w/2,cy:hit.y+hit.h/2,w:hit.w,h:hit.h,lost:0}; vx=vy=null; held=null; }
  }
});
stage.addEventListener('pointermove',ev=>{ if(drag){ vx=ev.clientX*devicePixelRatio+drag.dx; vy=ev.clientY*devicePixelRatio+drag.dy; } });
stage.addEventListener('pointerup',()=>{ if(!drag) return; drag=null; const W=stage.width,H=stage.height,m=H*vsizeF*0.25;
  if(vx<m||vx>W-m||vy<m||vy>H-m){ lock=null;vx=vy=null;held=null; } else held={x:vx,y:vy}; });

// ---------- render ----------
function drawScene(W,H){
  let g;
  if(scene==='sky'){ g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#6fb7ff'); g.addColorStop(1,'#dff1ff'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.font=`${H*0.12}px serif`; ctx.textAlign='left'; ctx.textBaseline='alphabetic'; ctx.fillText('☁️',W*0.15,H*0.25); ctx.fillText('☁️',W*0.65,H*0.18); ctx.fillText('🌞',W*0.85,H*0.15); }
  else if(scene==='space'){ ctx.fillStyle='#0b1a3a'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#fff'; for(let i=0;i<80;i++) ctx.fillRect((i*97)%W,(i*193)%H,3,3);
    ctx.font=`${H*0.12}px serif`; ctx.textAlign='left'; ctx.textBaseline='alphabetic'; ctx.fillText('🌍',W*0.8,H*0.25); ctx.fillText('🌙',W*0.1,H*0.2); }
  else { g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#8fcbff'); g.addColorStop(0.72,'#e9f5ff'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.72);
    ctx.fillStyle='#8ccf6e'; ctx.fillRect(0,H*0.72,W,H*0.28); ctx.fillStyle='#4a4a4a'; ctx.fillRect(0,H*0.82,W,H*0.12);
    ctx.fillStyle='#fff'; for(let x=0;x<W;x+=W*0.12) ctx.fillRect(x,H*0.875,W*0.06,H*0.01);
    ctx.font=`${H*0.12}px serif`; ctx.textAlign='left'; ctx.textBaseline='alphabetic'; ctx.fillText('🌳',W*0.05,H*0.78); ctx.fillText('🏠',W*0.75,H*0.78); ctx.fillText('🌞',W*0.85,H*0.15); }
}
// draws vehicle at (x,y) with the given rider (sticker-like {c,faceBottom,faceCx}) sitting in it
function drawVehicle(x,y,rider){
  const H=stage.height, vs=H*vsizeF, fs=vs*0.9, k=ink(vehicle.e);
  ctx.font=`${fs}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(vehicle.e,x,y);
  if(rider){
    const inkTop=y+k.top*fs, inkH=(k.bottom-k.top)*fs, inkW=(k.right-k.left)*fs, inkCx=x+(k.left+k.right)/2*fs;
    const seatY=inkTop+inkH*vehicle.seat;
    const dw=inkW*vehicle.kid, sc=dw/rider.c.width, dh=rider.c.height*sc;
    const dx=inkCx-rider.faceCx*sc, dy=seatY-rider.faceBottom*sc;
    ctx.drawImage(rider.c,dx,dy,dw,dh);
    ctx.save(); ctx.beginPath(); ctx.rect(x-fs, seatY, fs*2, y+fs-seatY); ctx.clip(); ctx.fillText(vehicle.e,x,y); ctx.restore();
  }
}
function vehicleHome(ts){ const W=stage.width,H=stage.height; return [W/2, (scene==='road'?H*0.62:H*0.5)+Math.sin(ts/600)*H*0.01]; }

function loop(ts){
  const W=stage.width, H=stage.height; computeFit();
  if(mode==='camera'||mode==='live'){ if(camOn && video.readyState>=2){ grabFrame(); detectFaces(ts); } }
  if(mode==='camera'){
    ctx.drawImage(src,fit.ox,fit.oy,src.width*fit.s,src.height*fit.s);
    ctx.strokeStyle='#ffd400'; ctx.lineWidth=4; for(const f of faces){ const [a,b]=toCanvas(f.x,f.y); ctx.strokeRect(a,b,f.w*fit.s,f.h*fit.s); }
    statusEl.textContent = faces.length ? `${faces.length} face${faces.length>1?'s':''} — press the button` : 'Face the camera…';
  }
  else if(mode==='pick'){
    ctx.drawImage(lastShot.frame,fit.ox,fit.oy,src.width*fit.s,src.height*fit.s);
    ctx.strokeStyle='#ffd400'; ctx.lineWidth=5; for(const f of lastShot.faces){ const [a,b]=toCanvas(f.x,f.y); ctx.strokeRect(a,b,f.w*fit.s,f.h*fit.s); }
    statusEl.textContent='Tap the face you want in the '+vehicle.e;
  }
  else if(mode==='live'){
    if(camOn && video.readyState>=2){
      maskCoverage=segment(ts);
      cctx.globalCompositeOperation='source-over'; cctx.drawImage(src,0,0); cctx.globalCompositeOperation='destination-in'; cctx.drawImage(maskC,0,0,cut.width,cut.height); cctx.globalCompositeOperation='source-over';
      if(lock){ let best=null,bd=Infinity; for(const f of faces){ const d=Math.hypot(f.x+f.w/2-lock.cx,f.y+f.h/2-lock.cy); if(d<bd){bd=d;best=f;} }
        if(best&&bd<lock.w*2){ const k=0.35; lock.cx+=(best.x+best.w/2-lock.cx)*k; lock.cy+=(best.y+best.h/2-lock.cy)*k; lock.w+=(best.w-lock.w)*k; lock.h+=(best.h-lock.h)*k; lock.lost=0; } else lock.lost++; }
    }
    drawScene(W,H);
    if(!lock){
      ctx.drawImage(cut,fit.ox,fit.oy,cut.width*fit.s,cut.height*fit.s);
      ctx.strokeStyle='rgba(31,111,235,.9)'; ctx.lineWidth=4; ctx.setLineDash([12,8]); for(const f of faces){ const [a,b]=toCanvas(f.x,f.y); ctx.strokeRect(a,b,f.w*fit.s,f.h*fit.s); } ctx.setLineDash([]);
      statusEl.textContent = maskCoverage<0.01 && faces.length ? '⚠️ cutout empty' : (faces.length ? 'Live — tap a face to put them in the '+vehicle.e : 'Live — looking for faces…');
    } else {
      const vs=H*vsizeF; const [fx]=toCanvas(lock.cx,lock.cy);
      const tx=Math.max(vs*0.5,Math.min(W-vs*0.5,fx)), [,ty]=vehicleHome(ts);
      if(drag){} else if(held){ vx=held.x; vy=held.y+Math.sin(ts/500)*H*0.01; } else if(vx==null){ vx=tx; vy=ty; } else { vx+=(tx-vx)*0.08; vy+=(ty-vy)*0.08; }
      const cp=CROPS[cropName]; const sw=lock.w*cp.side*2, sx=lock.cx-sw/2, sy=lock.cy-lock.h/2-lock.h*cp.up, sh=lock.h*cp.down;
      const rc=document.createElement('canvas'); rc.width=Math.max(1,sw|0); rc.height=Math.max(1,sh|0); rc.getContext('2d').drawImage(cut,sx,sy,sw,sh,0,0,rc.width,rc.height);
      drawVehicle(vx,vy,{c:rc,faceBottom:(lock.cy+lock.h/2)-sy,faceCx:lock.cx-sx});
      statusEl.textContent = lock.lost>15 ? '🟠 lost the face — look at the camera' : 'Drag the '+vehicle.e+' · fling off the edge or double-tap to let them out';
    }
  }
  else { // idle
    drawScene(W,H);
    if(vx==null||!held){ const [hx,hy]=vehicleHome(ts); vx=hx; vy=hy; }
    drawVehicle(vx,vy,sticker);
    if(!sticker) statusEl.textContent = segmenter ? 'Tap the '+vehicle.e+' (or 📷) to take a photo' : 'Loading AI models…';
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- models ----------
(async()=>{
  try{
    const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    segmenter=await ImageSegmenter.createFromOptions(vision,{ baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite",delegate:"CPU"},
      runningMode:"VIDEO", outputCategoryMask:false, outputConfidenceMasks:true });
    detector=await FaceDetector.createFromOptions(vision,{ baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",delegate:"GPU"},
      runningMode:"VIDEO", minDetectionConfidence:0.5 });
  }catch(e){ statusEl.textContent='Model load failed: '+e.message; console.error(e); }
